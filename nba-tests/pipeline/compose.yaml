x-airflow: &airflow
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow@airflow-db/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    NBA_DATABASE_URL: postgresql://nba@nba-db/nba
    NBA_SOURCE_MODE: ${NBA_SOURCE_MODE}
  user: "${AIRFLOW_UID}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./lib:/opt/airflow/lib
    - ./scripts:/opt/airflow/pipeline/scripts:ro
    - ./config/webserver_config.py:/opt/airflow/webserver_config.py:ro
    - nba_inbox:/data/inbox
    - nba_raw:/data/raw
    - nba_publish:/data/publish
    - ../../src/app/data:/workspace/src/app/data
  depends_on:
    airflow-db:
      condition: service_healthy
    nba-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  nba-db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: nba
      POSTGRES_DB: nba
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - nba_db:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow
    command: airflow db migrate

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8765:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_db:
  nba_db:
  nba_inbox:
  nba_raw:
  nba_publish:
